<ion-header class="ion-no-border nc-header">
  <ion-toolbar>
    <div class="nc-toolbar">
      <!-- Modo directo: avatar del otro estudiante. Modo solicitud: logo UMNG -->
      <div class="peer-avatar" *ngIf="isDirect">
        <img *ngIf="peer?.photoUrl" [src]="peer?.photoUrl" alt="" class="peer-avatar-img">
        <span *ngIf="!peer?.photoUrl && peerInitials" class="peer-avatar-initials">{{ peerInitials }}</span>
        <ion-icon *ngIf="!peer?.photoUrl && !peerInitials" name="person-outline"></ion-icon>
      </div>
      <img *ngIf="!isDirect"
           src="assets/images/logo-umng.png"
           alt="Logo UMNG"
           class="nc-toolbar-logo">

      <div class="chat-heading">
        <span class="chat-title">{{ headerTitle }}</span>
        <span class="chat-subtitle" *ngIf="isDirect">
          <ion-icon [name]="topicIcon" aria-hidden="true"></ion-icon>
          {{ topicLabel }}
        </span>
        <span class="chat-subtitle" *ngIf="isDirect && peer?.studentCode">
          Código {{ peer?.studentCode }}
        </span>
      </div>

      <button class="nc-icon-btn" (click)="goBack()" aria-label="Salir del chat">
        <ion-icon name="log-out-outline"></ion-icon>
      </button>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="messages-container">

    <!-- Cargando / abriendo la conversación -->
    <div *ngIf="loading" class="chat-state">
      <ion-spinner name="crescent"></ion-spinner>
    </div>

    <!-- Error al resolver la conversación -->
    <div *ngIf="!loading && errorMessage && messages.length === 0" class="chat-state">
      <p class="chat-error">{{ errorMessage }}</p>
    </div>

    <!-- Conversación vacía -->
    <div *ngIf="!loading && !errorMessage && messages.length === 0" class="empty-chat">
      <p>{{ emptyStateText }}</p>
    </div>

    <div *ngFor="let msg of messages"
         class="message-bubble"
         [class.own]="isOwn(msg)"
         [class.other]="!isOwn(msg)">
      <span class="sender-name" *ngIf="!isOwn(msg)">{{ msg.senderName }}</span>
      <div class="bubble-content">{{ msg.content }}</div>
      <span class="msg-time">{{ msg.createdAt | date:'shortTime' }}</span>
    </div>

    <!-- Ancla para auto-scroll al último mensaje -->
    <div #scrollAnchor></div>

  </div>
</ion-content>

<ion-footer class="ion-no-border">
  <!-- Aviso de fallo de envío, sin tapar la barra de escritura -->
  <div class="send-error" *ngIf="errorMessage && messages.length > 0" role="alert">
    {{ errorMessage }}
  </div>

  <div class="chat-input-bar">
    <ion-input
      [(ngModel)]="newMessage"
      placeholder="Escribe un mensaje..."
      class="chat-input"
      [disabled]="loading || !channelId"
      (keyup.enter)="sendMessage()">
    </ion-input>
    <button class="send-btn"
            (click)="sendMessage()"
            aria-label="Enviar mensaje"
            [disabled]="!newMessage.trim() || sending || loading || !channelId">
      <ion-icon name="send-outline"></ion-icon>
    </button>
  </div>
</ion-footer>
